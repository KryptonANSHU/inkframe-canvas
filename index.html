<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Inkframe is a browser-based canvas design tool." />
    <title>Inkframe</title>
    <link rel="icon" type="image/svg+xml" href="/logos/favicon.svg" />
    <link rel="apple-touch-icon" href="/logos/apple-touch-icon.png" />
    <meta property="og:title" content="Inkframe" />
    <meta property="og:image" content="/logos/preview.png" />
    <!-- Applies a saved theme before first paint, so dark mode never flashes light. -->
    <script>
      try {
        const theme = localStorage.getItem('inkframe.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
